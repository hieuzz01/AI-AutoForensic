# prefer = "auto"   # auto|bash|powershell|pwsh; empty/default = auto-detect
# path   = "/opt/homebrew/bin/bash"   # absolute path to the shell executable; empty = PATH lookup
# args   = ["-d", "Ubuntu", "--", "/bin/bash"]   # Windows: launcher arguments for path (wsl.exe); verified by running them

# [tools.shell.env]   # extra variables every bash command inherits
# BASH_ENV = "~/.reasonix/bashsandbox.rc"

