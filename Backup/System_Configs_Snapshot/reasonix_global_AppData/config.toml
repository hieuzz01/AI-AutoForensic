# Reasonix configuration.
# Resolution order: flag > project config > ~/AppData/Roaming/reasonix/config.toml > built-in defaults.
# Project config: ./reasonix.toml, otherwise .reasonix/reasonix.toml.
# Fields marked user/global only are not overridden by project config.
# Secrets are named via api_key_env and stored in Reasonix's global .env; never put keys here.

config_version = 12   # schema marker for diagnostics; old versions may ignore it
default_model = "gemini/gemini-3.8-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG
credentials_store = "auto"   # legacy compatibility; provider keys are saved in Reasonix's global .env

[ui]
theme = "auto"   # auto|dark|light; CLI colors only; REASONIX_THEME can override per run
# theme_style = "graphite"   # graphite|aurora|slate|carbon|nocturne|amber and legacy aliases
# shortcut_layout = "desktop"   # classic|desktop; compatibility setting; Shift+Tab toggles Plan, Ctrl+Y toggles YOLO
# cursor_shape = "bar"   # block|underline|bar; text input cursor shape
# show_reasoning = true   # CLI: show thinking text by default; false = collapsed (toggle with Ctrl+O)
show_turn_usage = true   # CLI/TUI: show per-request token and cost receipts in the transcript
show_changed_files = true   # Studio: show the changed-files pill above the composer; false = the count stays in the branch chip
feedback_level_notices = false   # tell me when my feedback level goes up (Studio note, /feedback list line); false = nothing is said
fold_turn_work = false   # Studio: fold a turn's tool calls, thinking and middle sentences under one line, keeping the last sentence out; false = every step stays drawn
show_receipt = false   # TUI and Studio: draw the end-of-turn delivery receipt card; false = one line only when something is unproven

[desktop]
# language = "zh"   # desktop UI language; empty/auto = browser/OS auto-detect
theme = "auto"   # desktop only: auto|dark|light
terminal_theme = "auto"   # integrated terminal: auto|dark|light; auto follows the desktop app
# theme_style = "graphite"   # graphite|aurora|slate|carbon|nocturne|amber and legacy aliases
# theme_pack = "my-theme"   # a pack under <memory root>/themes; empty is the default appearance
# external_opener = "vscode"   # desktop Open control: installed application id
# editor = "code"   # command or path the workspace opens in; empty searches this machine
close_behavior = "background"   # desktop: quit|background when the window close button is clicked
tray = "auto"   # desktop: auto|off status icon; with no icon the close button quits whatever the line above says
status_bar_style = "text"   # desktop: icon|text metric labels in the bottom status bar
status_bar_items = ["model", "workspace", "git_branch", "cache", "cache_avg", "session_tokens", "turn_tokens", "turn_tps", "turn_output_tokens", "turn_cache_tokens", "turn_cost", "session_turns", "context", "compact", "cost", "balance"]   # desktop: ordered visible bottom status bar items
# default_tool_approval_mode  = "allow"   # desktop: unset opens in Auto only where the OS sandbox confines writes and the folder is trusted
check_updates = true   # desktop: check for new versions on startup
telemetry = true   # desktop: anonymous daily ping + scrubbed next-launch native crash diagnostics + per-package market install counts (anonymous, no content); never content
metrics = true   # desktop: aggregate quality/lifecycle metrics (anonymous signal/bucket counts) + per-package market install counts (anonymous, no content); never content
expand_thinking = false   # desktop: legacy reasoning display alias; use reasoning_display_mode
display_mode = "standard"   # desktop: standard|compact transcript display mode
welcomed = true   # the opening sequence has played on this machine
default_tool_approval_mode = "yolo"   # desktop: Ask/Auto/YOLO default for newly-created sessions

[billing]
# display_currency = "auto"   # auto|CNY|USD; display only — does not rewrite provider list prices

[serve]
# remember_paired_devices = true   # keep the phones that paired; a restart reopens the share and adopts them
# share_port = 41234   # fixed port of the phone-access LAN link; unset picks a free one each time

[notifications]
enabled = false   # system notifications for CLI and desktop turns; default off
turn_done = true   # notify when a turn finishes
approval_request = true   # notify when a tool approval is waiting
ask_request = true   # notify when a question is waiting
feedback_reply = true   # notify when a feedback report gets a reply
disk_low = true   # notify when the workspace or state volume is nearly full
sound = false   # play a short chime for the events above, with or without system notifications; default off

[notifications.phone]
enabled = false   # tell enrolled phones that something is waiting (a type and a count, never text); default off
approval = false   # a tool approval is waiting
input = false   # the model asked a question
error = false   # a turn failed

[network]
proxy_mode = "auto"   # auto|env|custom|off; auto currently uses env proxy
# proxy_url  = "socks5://127.0.0.1:7890"   # optional custom override
# no_proxy   = "localhost,127.0.0.1,.local"   # honored for proxy_mode = "custom"
# dns        = ["223.5.5.5", "1.1.1.1"]   # resolvers to use instead of the system's
# doh        = "https://1.1.1.1/dns-query"   # encrypted DNS; wins over `dns`

[network.proxy]
type = "socks5"   # http|https|socks5|socks5h
# server = "127.0.0.1"
# port = 7890
# username = ""
# password = "${REASONIX_PROXY_PASSWORD}"   # optional; supports ${VAR} expansion

[environment]
enabled = true   # inject a stable startup environment summary into the model prompt
offline = false   # declare that outbound network access is unavailable; prevents futile retries
# [environment.tools]
# go = "/opt/homebrew/bin/go"   # trusted executable path; workspace-local paths are not auto-executed

[agent]
system_prompt = """You are V-AutoFor, an elite Digital Forensics and Incident Response (DFIR) AI platform.

CRITICAL MANDATORY RULE - FORENSIC TOOL INVOCATION:
You MUST NEVER execute raw PowerShell/Bash commands (such as Get-Content, type, cat, Select-String, python scripts) to inspect or parse forensic evidence files!
Instead, you MUST ALWAYS invoke the specialized ForBrain FastMCP forensic tools using `use_capability` with action="call" and the exact capability_id:
1. Evidence Integrity Verification (ISO/IEC 27037):
   use_capability(action="call", capability_id="mcp-tool:eztools/verify_evidence_integrity", arguments={"evidence_path": "...", "companion_metadata_path": "..."})
2. AD1 Logical Image Extraction / Listing:
   use_capability(action="call", capability_id="mcp-tool:network_memory/ad1_extract", arguments={"ad1_path": "..."})
   use_capability(action="call", capability_id="mcp-tool:network_memory/ad1_list", arguments={"ad1_path": "..."})
3. Linux Log & Bash History Forensics:
   use_capability(action="call", capability_id="mcp-tool:eztools/analyze_linux_logs", arguments={"target_dir": "..."})
4. Windows Prefetch Forensics (.pf):
   use_capability(action="call", capability_id="mcp-tool:eztools/parse_prefetch", arguments={"source_path": "..."})
5. Windows Amcache Forensics (Amcache.hve):
   use_capability(action="call", capability_id="mcp-tool:eztools/parse_amcache", arguments={"source_path": "..."})
6. Windows Shimcache Forensics (SYSTEM):
   use_capability(action="call", capability_id="mcp-tool:eztools/parse_shimcache", arguments={"source_path": "..."})
7. Windows $MFT Forensics:
   use_capability(action="call", capability_id="mcp-tool:eztools/parse_mft", arguments={"source_path": "..."})
8. Windows Event Logs (.evtx):
   use_capability(action="call", capability_id="mcp-tool:eztools/parse_evtx", arguments={"source_path": "..."})
9. Windows Shellbags (UsrClass.dat):
   use_capability(action="call", capability_id="mcp-tool:eztools/parse_shellbags", arguments={"source_path": "..."})
10. PE Malware & Static Binary Analysis (.exe, .dll, .sys):
    use_capability(action="call", capability_id="mcp-tool:eztools/pe_analyze", arguments={"pe_path": "..."})
11. Autostart & Persistence Triage:
    use_capability(action="call", capability_id="mcp-tool:sysinternals/autoruns_triage", arguments={})
12. Memory Forensics (Volatility 3):
    use_capability(action="call", capability_id="mcp-tool:network_memory/volatility_pslist", arguments={"image_path": "..."})
    use_capability(action="call", capability_id="mcp-tool:network_memory/volatility_malfind", arguments={"image_path": "..."})
13. Network PCAP Forensics:
    use_capability(action="call", capability_id="mcp-tool:network_memory/tshark_conversations", arguments={"pcap_path": "..."})
    use_capability(action="call", capability_id="mcp-tool:network_memory/tshark_dns_queries", arguments={"pcap_path": "..."})

WHY: Every invocation of these MCP tools automatically broadcasts live telemetry events to the ForBrain Observability Monitor at http://127.0.0.1:5000 so the user can verify that specialized DFIR engines are running. When you run raw PowerShell/bash instead, the monitor stays completely empty and fails inspection.

Always structure your final incident response report according to the 8-part DFIR standard in `forensic-reporting` skill."""
temperature       = 0.0
# recovery_model = "deepseek-pro"   # optional; falls back to guardian then main model
# reasoning_language = "zh"   # visible reasoning language: auto|zh|en
# turn_narration = "detailed"   # between tool calls: brief|detailed (detailed asks for a few lines per batch)
compact_ratio       = 0.9   # fold at this share of the model window (default 0.90)
# checkpoint_ceiling_ratio = 0.50   # how small a fold's result must be to be accepted
# plan_mode_read_only_commands = ["gh issue view"]   # legacy compatibility only; Plan bash uses Permissions
# embedded_diff_detection = true   # mark a shell result that is a whole unified diff so a frontend renders it as a diff (default false)
# ask_timeout_seconds = 300   # skip an ask question, or continue a task list handed back to you, when nobody answered in this long (default 0: wait)
# goal_auto_retry = 0   # retry a Goal paused because its completion check could not run, up to this many times in a row (max 5); user file only
# planner_model = "deepseek-pro"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# vision_model = "kimi/kimi-k2-vision"   # optional: reads images a text-only main model cannot
# guardian_model = "deepseek-pro"   # optional: independent reviewer for risky calls
# guardian_temperature = 0.0   # the reviewer's own sampling temperature
# decision_model = "typesafe/system-one"   # optional: the system_one backend
# triage_model = "deepseek-flash"   # small classifications; point it somewhere cheap
# advisor_model = "deepseek-pro"   # optional: offers the advise tool, backed by this model
# best_of_n = true   # parallel attempts in git worktrees; a judge applies the best
# worktree_isolation = true   # task can run a writer in a git worktree; changes wait for apply_isolated
# code_mode = true   # run_script: tool calls from a short script, one round trip
# screen_external_content = true   # triage flags external results that address the agent
# goal_token_budget = 200000   # what a /goal loop may spend before it stops
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# max_subagent_depth = 8   # nested subagent delegation depth; 1 restores the old single-layer boundary
# max_subagent_concurrency = 0   # session-wide sub-agent concurrency (task/fleet/skills)
# max_parallel_writers = 0   # concurrent writers with non-overlapping write_paths
# max_side_sessions = 0   # side conversations open at once; 0 = no limit; user file only
# max_provider_retries = 10   # retries of a failed provider connection before the turn stops; 0 = keep trying until cancelled; user file only
# max_queued_inputs = 0   # prompts waiting in a session's queue; 0 = no limit; user file only
# subagent_claims = "optimistic"   # optimistic (default): a sub-agent that declared no write_paths holds only the path it is writing; strict: it holds the whole workspace; user file only
# write_lease = "optimistic"   # optimistic (default): a writer that declared no path does not hold the whole workspace against other sessions; strict: it does; user file only
# write_lease_max_wait_minutes = 0   # minutes a write waits behind another session's claim before it fails with workspace.claim_timeout; 0 = wait as long as the turn lasts (default), 120 is a sensible limit; user file only
# plan_approval = "ask"   # auto: the plan card answers itself and execution starts; user file only
# default_mode = "normal"   # plan: a new conversation starts in plan mode (the mode picker still switches it); a resumed one keeps its own; user file only
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

