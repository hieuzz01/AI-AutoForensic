kind        = "anthropic"
base_url    = "https://api.deepseek.com/anthropic"
models      = ["deepseek-flash", "deepseek-v4-pro"]
default     = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"   # optional; wallet-balance endpoint shown in the status bar
context_window = 1000000   # tokens; compaction triggers near this limit
# max_output_tokens = 0       # recommended: automatic (DeepSeek default high → ~64K; not unlimited)
# max_output_tokens = 32768   # ordinary coding / cost control
# max_output_tokens = 65536   # heavy reasoning / long tool loops
# max_output_tokens = 131072  # only after repeated finish_reason=length
# idle_timeout_seconds = 300   # per-provider stream idle watchdog; default 300s
prices      = { "deepseek-flash" = { cache_hit = 0.003, input = 0.15, output = 0.6, currency = "$" }, "deepseek-v4-pro" = { cache_hit = 0.022, input = 0.66, output = 1.98, currency = "$" } }   # per-model prices, per 1M tokens
billing_currency = "USD"   # frozen list-price currency; independent of display_currency
thinking    = "enabled"
vision_models = ["deepseek-flash"]   # models in this provider that accept image input
web_search  = true   # provider-executed web_search tool; omitted defaults on for supported official DeepSeek APIs
model_overrides   = { "deepseek-flash" = { supported_efforts = ["disabled", "low", "high", "max"], default_effort = "low", vision = true }, "deepseek-v4-pro" = { supported_efforts = ["disabled", "high", "max"], default_effort = "high" } }   # per-model context/output/reasoning/vision overrides for mixed gateways

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap
mcp_startup_timeout_seconds = 30   # background initialize + tools/list safety cap; per-plugin overrides may raise it
mcp_call_timeout_seconds = 300   # default MCP call safety cap; per-plugin/tool overrides may raise it
protect_changed_files = true   # refuse a whole-file write over a change made since the agent last saw the file
browser_tools = true   # built-in browser tools; the browser starts on first use
mcp_resources = false   # a tool that reads resources a connected MCP server declares; user file only
present_files = true   # let the model declare clickable file-delivery cards; user file only, reopen session to apply

[tools.background_jobs]
stalled_warning_seconds = 900   # warn once per background job after this many quiet seconds; 0 disables

[tools.shell]
